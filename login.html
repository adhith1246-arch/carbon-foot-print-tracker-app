<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — GreenCampus Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Inter',sans-serif;
      background:#F8FAF8;
      color:#1F2937;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* Particle Canvas */
    #login-particles {
      position:fixed;inset:0;pointer-events:none;z-index:0;
    }

    /* Floating organic shapes */
    .orb {
      position:fixed;border-radius:50%;filter:blur(80px);opacity:0.12;pointer-events:none;
      animation:float 10s ease-in-out infinite;
    }
    .orb-1 { width:400px;height:400px;background:#0F5132;top:-100px;left:-100px; }
    .orb-2 { width:350px;height:350px;background:#2EC4B6;bottom:-100px;right:-100px;animation-delay:5s; }
    .orb-3 { width:250px;height:250px;background:#22c55e;top:50%;left:60%;animation-delay:2.5s; }

    @keyframes float {
      0%,100% { transform:translate(0,0) scale(1); }
      50% { transform:translate(20px,-20px) scale(1.05); }
    }

    .auth-container {
      position:relative;z-index:1;width:100%;max-width:440px;padding:20px;
    }

    .auth-card {
      background:rgba(255,255,255,0.8);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(15,81,50,0.1);
      border-radius:24px;padding:40px 36px;
      box-shadow:0 20px 60px rgba(0,0,0,0.08);
    }

    .auth-logo { text-align:center;margin-bottom:32px; }

    .auth-logo .icon {
      width:64px;height:64px;margin:0 auto 16px;border-radius:16px;
      background:linear-gradient(135deg,#0F5132,#2EC4B6);
      display:flex;align-items:center;justify-content:center;font-size:32px;
      box-shadow:0 8px 24px rgba(15,81,50,0.2);
    }

    .auth-logo h1 {
      font-size:24px;font-weight:800;
      background:linear-gradient(135deg,#0B3B24,#2EC4B6);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }

    .auth-logo p { font-size:13px;color:#15803d;opacity:0.7;margin-top:6px; }

    .tab-switch {
      display:flex;gap:4px;background:rgba(15,81,50,0.05);
      border-radius:10px;padding:4px;margin-bottom:28px;
    }

    .tab-btn {
      flex:1;padding:10px;border:none;border-radius:8px;
      background:transparent;color:#15803d;opacity:0.6;
      font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
      cursor:pointer;transition:all 0.3s;
    }

    .tab-btn.active {
      background:rgba(15,81,50,0.08);color:#0F5132;opacity:1;
    }

    .form-group { margin-bottom:18px; }

    .form-label {
      display:block;font-size:12px;font-weight:600;
      color:#15803d;opacity:0.7;margin-bottom:8px;
      text-transform:uppercase;letter-spacing:0.5px;
    }

    .form-input {
      width:100%;padding:13px 16px;
      background:#fff;border:1px solid rgba(15,81,50,0.12);
      border-radius:10px;color:#1F2937;font-size:14px;
      font-family:'Inter',sans-serif;transition:all 0.2s;outline:none;
    }

    .form-input:focus {
      border-color:#2EC4B6;
      box-shadow:0 0 0 3px rgba(46,196,182,0.12);
    }

    .form-input::placeholder { color:#9ca3af; }

    .form-select {
      width:100%;padding:13px 16px;
      background:#fff;border:1px solid rgba(15,81,50,0.12);
      border-radius:10px;color:#1F2937;font-size:14px;
      font-family:'Inter',sans-serif;outline:none;
    }

    .btn-primary {
      width:100%;padding:14px;border:none;border-radius:10px;
      background:linear-gradient(135deg,#0F5132,#2EC4B6);color:#fff;
      font-size:15px;font-weight:700;font-family:'Inter',sans-serif;
      cursor:pointer;transition:all 0.3s;margin-top:8px;
      box-shadow:0 4px 16px rgba(15,81,50,0.2);
    }

    .btn-primary:hover {
      transform:translateY(-2px);box-shadow:0 8px 30px rgba(15,81,50,0.3);
    }

    .btn-primary:active { transform:translateY(0); }

    .error-msg {
      display:none;padding:10px 14px;margin-top:12px;
      background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);
      border-radius:8px;color:#dc2626;font-size:13px;font-weight:500;
    }

    .error-msg.show { display:block;animation:shake 0.4s ease; }

    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25% { transform:translateX(-6px); }
      75% { transform:translateX(6px); }
    }

    .auth-footer {
      text-align:center;margin-top:20px;font-size:12px;color:#15803d;opacity:0.5;
    }

    .auth-footer a { color:#0F5132;text-decoration:none;font-weight:600; }

    #register-form { display:none; }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<canvas id="login-particles"></canvas>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">🌿</div>
      <h1>GreenCampus</h1>
      <p>Campus Carbon Footprint Tracker · IIT Bombay</p>
    </div>

    <div class="tab-switch">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="login-email" placeholder="you@iitb.ac.in" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="btn-primary">Sign In →</button>
      <div class="error-msg" id="login-error"></div>
    </form>

    <!-- REGISTER -->
    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="reg-name" placeholder="Your Name" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="reg-email" placeholder="you@iitb.ac.in" required />
      </div>
      <div class="form-group">
        <label class="form-label">Department / Hostel</label>
        <select class="form-select" id="reg-dept">
          <option value="">Select</option>
          <option>H1 Hostel</option><option>H4 Hostel</option><option>H5 Hostel</option>
          <option>H7 Hostel</option><option>H10 Hostel</option><option>Main Building</option>
          <option>Lecture Hall Complex</option><option>Library</option>
          <option>Sports Complex</option><option>Canteen</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="reg-password" placeholder="Min 6 characters" required minlength="6" />
      </div>
      <button type="submit" class="btn-primary">Create Account →</button>
      <div class="error-msg" id="reg-error"></div>
    </form>

    <div class="auth-footer">
      <p>Sustainability Hackathon 2026 · <a href="#">IIT Bombay</a></p>
    </div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (tab==='login' ? i===0 : i===1));
  });
  document.getElementById('login-form').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? 'block' : 'none';
}

async function handleLogin(e) {
  e.preventDefault();
  const err = document.getElementById('login-error');
  err.classList.remove('show');
  try {
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      }),
    });
    const data = await res.json();
    if (data.success) window.location.href = '/';
    else { err.textContent = data.error; err.classList.add('show'); }
  } catch(ex) { err.textContent = 'Server error.'; err.classList.add('show'); }
}

async function handleRegister(e) {
  e.preventDefault();
  const err = document.getElementById('reg-error');
  err.classList.remove('show');
  try {
    const res = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('reg-name').value,
        email: document.getElementById('reg-email').value,
        department: document.getElementById('reg-dept').value,
        password: document.getElementById('reg-password').value,
      }),
    });
    const data = await res.json();
    if (data.success) window.location.href = '/';
    else { err.textContent = data.error; err.classList.add('show'); }
  } catch(ex) { err.textContent = 'Server error.'; err.classList.add('show'); }
}

// Mini particle system for login page
(function(){
  const c = document.getElementById('login-particles');
  if (!c) return;
  const ctx = c.getContext('2d');
  let W, H;
  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  const ps = Array.from({length:30}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    s: Math.random()*4+1, vy: -(Math.random()*0.3+0.1),
    vx: (Math.random()-0.5)*0.2, o: Math.random()*0.4+0.1
  }));
  (function draw(){
    requestAnimationFrame(draw);
    ctx.clearRect(0,0,W,H);
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
      ctx.fillStyle=`rgba(15,81,50,${p.o})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
    }
  })();
})();
</script>
</body>
</html>
